<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Which Greek God Are You? (Deep Cuts Edition)</title>
<meta name="description" content="A branching quiz that places you among 20 Greek gods, mostly the lesser-known ones.">
<meta property="og:title" content="Which Greek God Are You? (Deep Cuts Edition)">
<meta property="og:description" content="Branching paths. 20 gods. Hephaestus, Momus, Nemesis, Nyx, and more.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏺</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbf5e6;--card:#fffdf5;--ink:#4a2a0c;--mut:#8a6a3f;--gold:#c77d0a;--line:#e6d3a8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1218;--card:#141d26;--ink:#f3e6c8;--mut:#b99c68;--gold:#f0a830;--line:#2c3a46}}
:root[data-theme="dark"]{--bg:#0b1218;--card:#141d26;--ink:#f3e6c8;--mut:#b99c68;--gold:#f0a830;--line:#2c3a46}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Crimson Text",Georgia,serif;font-size:1.1rem;line-height:1.5}
main{max-width:580px;margin:0 auto;padding:22px 16px 48px}
.card{background:var(--card);border:1px solid var(--line);border-top:6px solid var(--gold);border-bottom:6px solid var(--gold);border-radius:14px;padding:26px 20px}
h1,h2,.t{font-family:Cinzel,Georgia,serif}
h1{font-size:1.6rem;margin:0 0 6px;color:var(--gold);text-align:center;letter-spacing:.04em}
h2{font-size:1.15rem;margin:0 0 16px;font-weight:500}
p{margin:0 0 12px}
.mut{color:var(--mut);font-style:italic}
.c{text-align:center}
.t{color:var(--gold);font-size:.82rem;letter-spacing:.12em;text-transform:uppercase;margin:18px 0 6px}
.bar{height:5px;background:var(--line);border-radius:3px;margin-bottom:16px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);transition:width .3s}
button{font:inherit;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:10px;padding:13px 14px;width:100%;text-align:left;margin-bottom:10px;cursor:pointer}
button:hover,button:focus-visible{border-color:var(--gold);background:var(--bg);outline:none}
button.go{background:var(--gold);color:#fff;text-align:center;border-color:var(--gold);font-weight:600;font-family:Cinzel,Georgia,serif;letter-spacing:.06em}
button.alt{text-align:center}
ul{margin:0 0 12px;padding-left:20px}
li{margin-bottom:4px}
.sec{border-top:1px solid var(--line);margin-top:16px;padding-top:4px}
.row{display:flex;align-items:center;gap:10px;margin:6px 0;font-size:1rem}
.row span:first-child{width:110px}
.row .bar{flex:1;margin:0}
.row span:last-child{width:40px;text-align:right;color:var(--mut)}
</style>
</head>
<body>
<main><div class="card" id="app"></div></main>
<script>
// id: [name, title, about, [strengths], fatal flaw, short tag used for the "secondary pull" blend]
const G={
he:["Hephaestus","God of the Forge","The one Olympian who works with his hands. Thrown from Olympus, he still built the gods' palaces, thrones, and weapons. You make real things out of stubbornness and skill.",["Craft and engineering","Patience with hard problems","Turning rough ideas into working objects"],"Perfectionism. You'd rebuild it a fifth time before showing anyone an unfinished version.","a maker's patience"],
at:["Athena","Goddess of Strategy","Wisdom with a spear. She wins by planning, not by brute force, and she's the patron of clever people who actually follow through.",["Strategy and foresight","Pattern recognition","Calm under pressure"],"Overthinking, and the belief that you can out-plan everything.","a strategist's eye"],
ap:["Apollo","God of Music, Prophecy and Healing","Light, art, and clear sight. He stands for beauty done with discipline, and people trust him to say where things are heading.",["Artistry and discipline","Insight into what's coming","A healing presence"],"Pride in your own brilliance, and a short fuse when it's questioned.","an artist's polish"],
hm:["Hermes","God of Messengers and Tricksters","Fast, clever, always between places. He found the loophole before he was a day old, and he guides travelers and thieves alike.",["Quick wit and adaptability","Connecting people and ideas","Finding the shortcut"],"Restlessness, and bending the truth to stay one step ahead.","a trickster's speed"],
hs:["Hestia","Goddess of the Hearth","The oldest Olympian, who gave up her throne to keep the peace. Every home's fire was hers. She holds things together without needing credit.",["Steadiness","Making people feel safe","Keeping peace under pressure"],"Avoiding conflict so long that problems grow quietly.","a hearth-keeper's warmth"],
nm:["Nemesis","Goddess of Balance and Retribution","She sees that good and evil get paid back in kind, and she particularly deals with arrogance. Fairness isn't a preference for you, it's a law.",["A sharp sense of justice","Seeing through pride","Holding the line when others look away"],"Grudges. You can keep a ledger open for years.","a sense of justice"],
mo:["Momus","God of Satire and Criticism","A child of Night who mocked even the gods, including Zeus's own creations. Sharp, funny, and usually right about the flaw in the design.",["Spotting the flaw nobody else will say","Humor as a tool","Zero fear of authority"],"A critique that costs you your seat at the table. Momus was exiled from Olympus for it.","a satirist's bite"],
hy:["Hypnos","God of Sleep","Twin of Death and son of Night. Even Zeus couldn't resist him. He gives the world its rest, and he does it softly.",["Calm that spreads to others","Knowing when to power down","Quiet influence"],"Checking out when things get hard. Rest is not always the answer.","a rest-giver's calm"],
mp:["Morpheus","God of Dreams","The shaper of the forms people see in sleep. He can appear as anyone, in any shape, and is believed to deliver messages in dreams.",["Imagination","Reading people deeply","Making the abstract vivid"],"Living in your head. The dream feels better than the day.","a dreamer's imagination"],
tn:["Thanatos","God of Peaceful Death","Not a villain. He is gentle, inevitable, and honest. He represents endings that come without cruelty, and he's comfortable with what others avoid.",["Calm about hard truths","Comfort with endings","Steady presence when things are heavy"],"Emotional distance. You can go cold to avoid being swallowed.","a calm about endings"],
ty:["Tyche","Goddess of Fortune","She steered the fate of cities and carried a cornucopia and a rudder. Chance follows her, and she thrives where plans fall short.",["Seizing the opening","Comfort with uncertainty","Resilience when luck turns"],"Trusting luck over effort, until it runs out.","a gambler's nerve"],
nr:["Nereus","The Old Man of the Sea","An ancient, honest sea god who could foretell the future and change shape. He told the truth, but only if you caught him and held on.",["Honesty with depth","Prophetic sense","Adapting to any situation"],"Slipping away the moment you're pressed.","a shapeshifter's depth"],
pn:["Pan","God of the Wild and Shepherds","Goat-legged, pipe-playing, and happiest outdoors. Gut instinct, music, and open hills. His sudden shout gave us the word panic.",["Instinct","Joy in the moment","Closeness to nature and music"],"Impulsiveness. You follow the wild thing before checking where it goes.","a wild streak"],
ir:["Iris","Goddess of Rainbows and Messages","She carried messages between gods and mortals on a rainbow bridge, especially for Hera. You're the connection between people who couldn't reach each other.",["Bridging people","Delivering hard messages kindly","Reliability"],"Living in the middle. You carry everyone's words and lose your own.","a bridge-builder's tact"],
nk:["Nike","Goddess of Victory","Winged, tireless, and usually at Athena's side. She turns effort into wins, and she gives the glory only to those who go all in.",["Drive","Finishing strong","Rallying others"],"Needing the win. Rest feels like losing.","a champion's drive"],
ac:["Asclepius","God of Medicine","Born of a god and a mortal, he learned healing so well he began to raise the dead, which got him struck down by Zeus. His staff is still the symbol of medicine.",["Healing and repair","Compassion with skill","Refusing to give up on people"],"Crossing a line to save someone. You'll break the rules for the people you can't let go.","a healer's compassion"],
er:["Eris","Goddess of Strife","Daughter of Night. One golden apple, thrown into a wedding feast, set off the Trojan War. Discord isn't always destruction; sometimes it's the push that gets things moving.",["Sparking change","Not scared of conflict","Creative disruption"],"Stirring the pot for the thrill of it, and then watching it boil over.","a disruptor's spark"],
ch:["Chronos","God of Time","The personification of time itself. He does not rush and he does not stop, and everything measures itself against him.",["Patience and long-term vision","Timing","Knowing what lasts"],"Anxiety about the clock. Every hour spent is an hour gone.","a sense of timing"],
ny:["Nyx","Goddess of Night","Primordial and feared even by Zeus. Mother of Sleep, Death, Dreams, Strife, and Nemesis. She is the dark where everything starts.",["Depth","Quiet authority","Mastery of what's unseen"],"Hiding in the dark. Mystery can become isolation.","a depth of shadow"],
ar:["Aristaeus","God of Beekeeping and Rural Crafts","He taught people to keep bees, make cheese, and grow olives. Practical, quiet, and generous with knowledge, but history forgot to thank him.",["Practical skill","Teaching others","Patience with slow, steady work"],"Resentment when the work goes unthanked.","a gardener's patience"]
};
// Branching question graph. n(id, defaultNext, text, [[option, "godId+points ...", optionalNextId], ...])
const N={};const n=(id,nx,t,o)=>{N[id]={t,o,nx}};
n("R","","A door appears that wasn't there before. You open it and find:",[
["A torchlit hall full of voices and music","","A1","Hall"],["A quiet room of tools, books, and unfinished work","","B1","Workshop"],["Open country under a wide sky","","C1","Wilds"],["A dim, still space lit by something far away","","D1","Night"]]);
// Path A: the Hall
n("A1","A2","Every head in the hall turns to you. You:",[["Tell a story that lands","hm2 ap1"],["Poke fun at the host","mo2 er1"],["Make sure everyone has a seat and a plate","hs2 ir1"],["Challenge someone to a contest","nk2 er1"],["Slip out the side door","hm1 ny2"]]);
n("A2","A3","Two guests are fighting over something small. You:",[["Fan the flames, just a little","er2 mo1"],["Settle it fairly","nm2 ir1"],["Carry messages between them until they calm down","ir2 hm1"],["Bet on who wins","ty2 nk1"],["Pour them both a drink and change the subject","hs2 ap1"]]);
n("A3","","A stranger offers a deal that sounds too good. You:",[["Take it. Fortune loves the bold","ty2 nk1","A4a"],["Read every word twice","nm1 mo1","A4b"],["Ask what they really want","ir1 hm2","A4b"],["Counter with a better offer","hm2 ap1","A4a"],["Walk away","hs2 nm1","A4b"]]);
n("A4a","A5","You win, and the crowd chants. You:",[["Soak it in","nk2 ap1"],["Share the credit loudly","ir2 hs1"],["Look for the next challenge","nk1 er2"],["Give a speech nobody asked for","ap2 mo1"],["Feel uneasy and step back","ny1 hs1"]]);
n("A4b","A5","Something about the hall feels off. You:",[["Investigate quietly","hm1 ny2"],["Say it out loud","mo2 nm1"],["Warn the people you trust","ir2 hs1"],["Test it with a small provocation","er2 hm1"],["Leave a note and go","ir1 hm2"]]);
n("A5","A6","The morning after, what matters most?",[["Everyone got home safe","hs2 ir1"],["The story gets told right","ap2 hm1"],["What happened was fair","nm2 mo1"],["I gave it everything","nk2 ty1"],["It was memorable, even if chaotic","er2 pn1"]]);
n("A6","F1","What should people say about you?",[["They always showed up","ir2 hs1"],["Quick and clever","hm2 mo1"],["Never backed down","nk2 nm1"],["Never boring","er2 ty1"],["Made it feel like home","hs2 ap1"]]);
// Path B: the Workshop
n("B1","B2","A task is half done and nobody's watching. You:",[["Redo it until it's right","he2 at1"],["Finish it and move on","ar2 ch1"],["Write down how it works for others","at2 ac1"],["Test it on someone who needs it","ac2 he1"],["Think about how long it will last","ch2 ar1"]]);
n("B2","B3","You spot a flaw in something you admire. You:",[["Fix it quietly","he2 ac1"],["Study why it happened","at2 ch1"],["Tell the creator","mo2 ap1"],["Learn from it for next time","ar2 at1"],["Make it beautiful anyway","ap2 he1"]]);
n("B3","","Someone asks you to teach them. You:",[["Show them by doing","ar2 he1","B4a"],["Explain the principle first","at2 ch1","B4b"],["Turn it into a game","ap2 hm1","B4a"],["Ask what they actually need","ac2 hs1","B4b"],["Hand them a book and let them struggle","ch2 at1","B4b"]]);
n("B4a","B5","Your hands are full and a new problem arrives. You:",[["Drop everything for it","ac2 nk1"],["Finish what's in hand first","he2 ar1"],["Hand it to someone else","at2 hm1"],["Patch it fast","hm2 ar1"],["Improvise","ty2 pn1"]]);
n("B4b","B5","You have unlimited time. You:",[["Study one thing for years","ch2 at1"],["Master several crafts","ap2 he1"],["Tend a garden or a herd","ar2 hs1"],["Hunt for a cure to something old","ac2 ch1"],["Write it all down","at2 ap1"]]);
n("B5","B6","What bothers you most?",[["Wasted talent","ap2 ac1"],["Shoddy work","he2 nm1"],["Rushed decisions","ch2 at1"],["Things left to rot","ar2 ac1"],["Ignorance by choice","at2 mo1"]]);
n("B6","F1","The work is finished. You feel:",[["Already seeing what's wrong","he2 at1"],["Quietly proud","ar2 ap1"],["Relieved","ch1 hs1"],["Eager for the next one","ac2 nk1"],["Hopeful it outlasts you","ch2 he1"]]);
// Path C: the Wilds
n("C1","C2","You reach a fork in the trail. No map. You:",[["Take the one that feels right","pn2 ty1"],["Read the weather and the birds","nr2 ap1"],["Climb for a better view","ir2 nk1"],["Flip a coin","ty2 hm1"],["Take the less-traveled one","hm2 pn1"]]);
n("C2","C3","A storm rolls in. You:",[["Run out to meet it","pn2 nk1"],["Shelter and wait","ar2 hs1"],["Work out where it's heading","nr2 ap1"],["Trust your luck","ty2 pn1"],["Wait for the rainbow after","ir2 hs1"]]);
n("C3","","You come to a wide river. You:",[["Swim it","nr2 nk1","C4a"],["Find a place to cross","hm2 ar1","C4b"],["Follow it down to the sea","ir2 nr1","C4a"],["Camp and watch it a while","ar2 pn1","C4b"],["Rig a way across","at1 ar2","C4b"]]);
n("C4a","C5","A creature speaks to you. You:",[["Listen. It may know something","nr2 ap1"],["Trade stories","hm2 pn1"],["Ask for a favor and learn the price","ty2 hm1"],["Make friends","pn2 hs1"],["Race it","nk2 pn1"]]);
n("C4b","C5","A herd or a hive depends on you. You:",[["Tend it faithfully","ar2 hs1"],["Move it to better ground","pn1 ar2"],["Teach others how","ac2 ar1"],["Sing to it","pn2 ap1"],["Hand it off and wander","pn2 hm1"]]);
n("C5","C6","Evening comes. You're:",[["Playing music by the fire","pn2 ap1"],["Telling tall tales","hm2 pn1"],["Watching the stars","ny2 nr1"],["Cooking for everyone","hs2 ar1"],["Out cold","hy2 pn1"]]);
n("C6","F1","What do you take from the wild?",[["Freedom","pn2 ty1"],["Patience","ar2 nr1"],["The truth, as the tide tells it","nr2 mo1"],["A good story","hm2 ap1"],["A reason to keep going","nk2 ir1"]]);
// Path D: the Night
n("D1","D2","The world goes quiet. You:",[["Feel most awake","ny2 mp1"],["Drift toward sleep","hy2 mp1"],["Replay the day","ch2 mp1"],["Think about what ends and what stays","tn2 ch1"],["Keep a quiet watch","nm2 ny1"]]);
n("D2","D3","A friend confesses something heavy. You:",[["Sit with them, no words","tn2 hy1"],["Ask what they've been dreaming","mp2 hy1"],["Tell them the hard truth","mo2 nm1"],["Keep it, no judgment","ny2 hs1"],["Help them set it right","nm2 nr1"]]);
n("D3","","Someone tells you something hard to hear. You:",[["Thank them","tn2 nr1","D4a"],["Argue","mo2 er1","D4b"],["Go quiet and think","ny2 mp1","D4a"],["Remember it forever","ch2 nm1","D4b"],["Sleep on it","hy2 mp1","D4a"]]);
n("D4a","D5","You wake from a vivid dream. You:",[["Write it down","mp2 ch1"],["Search it for meaning","nr2 mp1"],["Go back to sleep","hy2 mp1"],["Shrug it off","tn1 ny1"],["Wonder who was in it","mp2 ir1"]]);
n("D4b","D5","Someone got away with something unfair. You:",[["Wait. It comes back around","nm2 tn1"],["Name it out loud","mo2 nm1"],["Make sure they know you know","ny2 nm1"],["Let it go","hy2 hs1"],["Let time handle it","ch2 tn1"]]);
n("D5","D6","What scares you least?",[["The dark","ny2 hy1"],["Endings","tn2 ch1"],["Being disliked for the truth","mo2 nm1"],["Being forgotten","mp1 ch2"],["Being alone","ny2 hs1"]]);
n("D6","F1","What do you hope the night gives you?",[["Rest","hy2 hs1"],["Answers","nr2 mp1"],["Justice, eventually","nm2 tn1"],["A good dream","mp2 hy1"],["Silence","ny2 tn1"]]);
// Finale: everyone answers these
n("F1","F2","You get one free afternoon. You:",[["Make something with your hands","he2 ar1"],["Meet up with people","hm2 hs1"],["Take a long walk","pn2 nr1"],["Nap","hy2 mp1"],["Go watch a match or contest","nk2 er1"]]);
n("F2","F3","Pick a gift for a friend:",[["Something handmade","he2 ac1"],["A book or a map","at2 ch1"],["A good meal","hs2 ar1"],["A funny card","mo2 hm1"],["A ticket somewhere","hm2 ty1"]]);
n("F3","F4","Your worst quality is:",[["Stubbornness","he1 nm2"],["Sarcasm","mo2 hm1"],["Escapism","hy2 mp1"],["Rashness","pn2 er1"],["Coldness","tn2 ny1"]]);
n("F4","F5","The best compliment is:",[["Brilliant","at2 ap1"],["Fair","nm2 at1"],["Warm","hs2 ac1"],["Fearless","nk2 pn1"],["Lucky","ty2 hm1"]]);
n("F5","F6","You can ask an oracle one thing:",[["How does it end?","tn2 ch1"],["What should I do next?","at2 nr1"],["Who can I trust?","nr2 ir1"],["Will it work?","ty2 ap1"],["Nothing. I'd rather not know","hy2 ny1"]]);
n("F6","F7","Pick a color:",[["Gold","ap2 nk1"],["Deep sea blue","nr2 ir1"],["Black","ny2 tn1"],["Forest green","ar2 pn1"],["Ember red","he2 er1"]]);
n("F7","F8","In an argument you:",[["Win with logic","at2 nm1"],["Use humor","mo2 hm1"],["Stir the pot","er2 mo1"],["Keep the peace","hs2 ir1"],["Walk out","ny2 hy1"]]);
n("F8","F9","What would you most want to protect?",[["People who can't help themselves","ac2 hs1"],["Fair play","nm2 nk1"],["Time that matters","ch2 tn1"],["Wild places","pn2 ar1"],["Good stories","ap2 hm1"]]);
n("F9","F10","Your relationship with luck:",[["Make your own","at2 nk1"],["Lean in","ty2 pn1"],["Notice the signs","nr2 mp1"],["Don't think about it","hy2 hs1"],["Test it","er2 hm1"]]);
n("F10","","How should it end?",[["Quietly","tn2 hy1"],["With applause","nk2 ap1"],["With a bridge built","ir2 hs1"],["With the work lasting","he2 ch1"],["In a mystery","ny2 mp1"]]);
const app=document.getElementById("app");let i=0,s={},path="",tb=0;
const add=x=>x&&x.split(" ").forEach(p=>{s[p.slice(0,2)]=(s[p.slice(0,2)]||0)+ +p[2]});
const rank=()=>Object.keys(G).sort((a,b)=>(s[b]||0)-(s[a]||0));
function start(){i=0;s={};path="";tb=0;
app.innerHTML='<h1>Which God Are You?</h1><p class="c t" style="margin-top:0">Deep Cuts Edition</p><p class="c mut">A branching quiz with '+Object.keys(G).length+' possible gods, mostly the ones the big names overshadow. Your first answer picks your path, and your later answers can fork it again. Two people can see very different questions.</p><button class="go" id="b">Begin</button>';
document.getElementById("b").onclick=()=>show("R")}
function show(id){if(!id)return finish();const q=N[id];
app.innerHTML='<div class="bar"><i style="width:'+Math.min(i/17,1)*100+'%"></i></div><p class="mut">Question '+(i+1)+'</p><h2>'+q.t+'</h2>';
q.o.forEach(o=>{const b=document.createElement("button");b.textContent=o[0];
b.onclick=()=>{add(o[1]);if(o[3])path=o[3];i++;show(o[2]||q.nx)};app.appendChild(b)})}
function finish(){const r=rank();
if(!tb&&(s[r[0]]-s[r[1]])<=3){tb=1;
app.innerHTML='<p class="mut">One last question</p><h2>Two or three voices are pulling at you. Which sounds most like you?</h2>';
r.slice(0,3).forEach(k=>{const b=document.createElement("button");b.textContent=G[k][5].replace(/^./,c=>c.toUpperCase());b.onclick=()=>{s[k]+=3;done()};app.appendChild(b)})}
else done()}
function done(){
const r=rank(),t=r[0],g=G[t],mx=s[t]||1,sec=G[r[1]];
let h='<h1>'+g[0]+'</h1><p class="c t" style="margin-top:0">'+g[1]+'</p><p>'+g[2]+'</p><p class="mut">You came in through the door of the '+path+'.</p>'
+'<div class="sec"><p class="t">Divine Strengths</p><ul>'+g[3].map(x=>'<li>'+x+'</li>').join('')+'</ul></div>'
+'<div class="sec"><p class="t">Fatal Flaw</p><p>'+g[4]+'</p></div>'
+'<div class="sec"><p class="t">Your Secondary Pull</p><p><b>'+sec[0]+'</b>, '+sec[1].toLowerCase().replace(/^(god|goddess) of/,'$1 of')+'. You also carry '+sec[5]+', which is why you aren\'t a pure '+g[0]+'.</p></div>'
+'<div class="sec"><p class="t">Closest Matches</p>';
r.slice(0,5).forEach(k=>{const p=Math.round((s[k]||0)/mx*100);h+='<div class="row"><span>'+G[k][0]+'</span><div class="bar"><i style="width:'+p+'%"></i></div><span>'+p+'%</span></div>'});
h+='</div><button class="go" id="r" style="margin-top:18px">Retake</button><button class="alt" id="sh">Share this quiz</button>';
app.innerHTML=h;
document.getElementById("r").onclick=start;
document.getElementById("sh").onclick=async e=>{const u=location.href;try{if(navigator.share)await navigator.share({title:document.title,url:u});else{await navigator.clipboard.writeText(u);e.target.textContent="Link copied"}}catch(x){}}}
start();
</script>
</body>
</html>
